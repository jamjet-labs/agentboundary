name: 41-refusal-policy-deny
description: |
  A denied action still produces a receipt, and the receipt says what was
  not allowed: refusal.verdict=deny, execution.status=blocked. The record
  of what the agent did includes what it was stopped from doing.
setup:
  receipt_version: agentboundary/v0.2-alpha
  now: "2026-06-15T14:23:00Z"
  policies:
    - name: agentboundary.repo.merges.locked
      version: "1"
      rule: deny
      capabilities: [github.merge]
action:
  actor: { type: agent, id: "agent:claude-code:session/demo" }
  agent:
    framework: claude-code
    framework_version: "2.4.1"
    model: claude-opus-4-7
    model_version: "20260101"
  tool: { name: github-mcp, version: "0.7.0", capability: github.merge }
  target:
    system: github.com/jamjet-labs/agentboundary
    environment: prod
    resource_id: pull/14
  arguments: { ref: refs/heads/main, sha: b1c2d3e4 }
expect:
  decision: deny
  conformance_level: 4
  receipt_must_validate: true
  assertions:
    - { field: version, equals: agentboundary/v0.2-alpha }
    - { field: policy.decision, equals: deny }
    - { field: execution.status, equals: blocked }
    - { field: refusal.verdict, equals: deny }
    - { field: refusal.reason_code, equals: policy-deny }
