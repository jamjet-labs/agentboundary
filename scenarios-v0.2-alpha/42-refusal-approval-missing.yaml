name: 42-refusal-approval-missing
description: |
  Approval was required and never came. The receipt records
  policy.decision=require-approval, no approval block, execution blocked,
  and refusal.verdict=require-approval. Under the v0.1 schema this honest
  receipt fails validation (approval is required unconditionally there);
  the v0.2-alpha schema requires approval only when the action proceeded.
setup:
  receipt_version: agentboundary/v0.2-alpha
  now: "2026-06-15T14:23:00Z"
  policies:
    - name: acme.claims.mutation
      version: "5"
      rule: require-approval
      capabilities: [spring.service.mutation]
      approvers:
        - { id: "user:eng-lead@acme", type: human }
      approval_max_age_seconds: 600
action:
  actor: { type: agent, id: "agent:internal-copilot:session/demo" }
  agent:
    framework: spring-ai
    framework_version: "1.0"
    model: gpt-4o
    model_version: "2024-08-06"
  tool: { name: claims-service, version: "3.2.0", capability: spring.service.mutation }
  target:
    system: acme-claims.prod
    environment: prod
    resource_id: claim/789
  arguments: { claim_id: 789, status: APPROVED, payout_cents: 4200 }
expect:
  decision: require-approval
  conformance_level: 4
  receipt_must_validate: true
  assertions:
    - { field: policy.decision, equals: require-approval }
    - { field: approval, equals: null }
    - { field: execution.status, equals: blocked }
    - { field: refusal.verdict, equals: require-approval }
    - { field: refusal.reason_code, equals: approval-missing }
