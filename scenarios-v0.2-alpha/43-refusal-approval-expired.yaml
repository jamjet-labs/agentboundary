name: 43-refusal-approval-expired
description: |
  The approval is genuine but 601 seconds old against a 600-second window.
  The v0.2-alpha runtime refuses to act on it and records
  refusal.verdict=expired with the stale approval as evidence. Level 4
  does not flag the stale approval: the action did not run on it.
  Compare scenario 11, where a v0.1 runtime ran on a stale approval.
setup:
  receipt_version: agentboundary/v0.2-alpha
  now: "2026-06-15T14:23:00Z"
  policies:
    - name: acme.claims.mutation
      version: "5"
      rule: require-approval
      capabilities: [spring.service.mutation]
      approvers:
        - { id: "user:eng-lead@acme", type: human }
      approval_max_age_seconds: 600
  approvals:
    - capability: spring.service.mutation
      approver: { type: human, id: "user:eng-lead@acme" }
      approved_at: "2026-06-15T14:12:59Z"
action:
  actor: { type: agent, id: "agent:internal-copilot:session/demo" }
  agent:
    framework: spring-ai
    framework_version: "1.0"
    model: gpt-4o
    model_version: "2024-08-06"
  tool: { name: claims-service, version: "3.2.0", capability: spring.service.mutation }
  target:
    system: acme-claims.prod
    environment: prod
    resource_id: claim/789
  arguments: { claim_id: 789, status: APPROVED, payout_cents: 4200 }
expect:
  decision: deny
  conformance_level: 4
  receipt_must_validate: true
  assertions:
    - { field: policy.decision, equals: require-approval }
    - { field: approval.approved_at, equals: "2026-06-15T14:12:59Z" }
    - { field: execution.status, equals: blocked }
    - { field: refusal.verdict, equals: expired }
    - { field: refusal.reason_code, equals: approval-window-elapsed }
