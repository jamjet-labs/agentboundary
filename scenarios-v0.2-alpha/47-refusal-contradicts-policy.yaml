name: 47-refusal-contradicts-policy
description: |
  The policy allowed the action, but the receipt claims a deny refusal.
  A refusal must agree with the recorded policy.decision; nothing is
  consistent with allow. LEVEL_2_REFUSAL_DECISION_MISMATCH fires.
setup:
  receipt_version: agentboundary/v0.2-alpha
  now: "2026-06-15T14:23:00Z"
  policies:
    - name: agentboundary.repo.merges
      version: "2"
      rule: allow
      capabilities: [github.merge]
action:
  actor: { type: agent, id: "agent:claude-code:session/demo" }
  agent:
    framework: claude-code
    framework_version: "2.4.1"
    model: claude-opus-4-7
    model_version: "20260101"
  tool: { name: github-mcp, version: "0.7.0", capability: github.merge }
  target:
    system: github.com/jamjet-labs/agentboundary
    environment: prod
    resource_id: pull/14
  arguments: { ref: refs/heads/main, sha: b1c2d3e4 }
  inject:
    - { op: mutate_field, path: execution.status, value: blocked }
    - op: mutate_field
      path: refusal
      value: { verdict: deny, reason_code: policy-deny }
      recompute_hash: true
expect:
  decision: allow
  conformance_level: 4
  receipt_must_validate: true
  failures_must_include: ["LEVEL_2_REFUSAL_DECISION_MISMATCH"]
