name: 56-chain-edited-receipt-rehashed
description: |
  Someone with write access to the receipt store changes the middle
  receipt of an unsigned chain and recomputes its receipt_hash, so that
  receipt checks out on its own. The next receipt's prior_receipt still
  commits to the old hash, so the offline verifier reports
  CHAIN_LINK_BROKEN. This is the chain-hash check: a bare receipt edited
  and rehashed is caught only when a later receipt holds its hash.
setup:
  receipt_version: agentboundary/v0.2-alpha
  now: "2026-06-15T14:23:00Z"
  policies:
    - name: agentboundary.repo.merges
      version: "2"
      rule: allow
      capabilities: [github.merge]
  chain:
    length: 3
    inject:
      - { op: edit_and_rehash, index: 1, path: target.resource_id, value: pull/99 }
action:
  actor: { type: agent, id: "agent:claude-code:session/demo" }
  agent:
    framework: claude-code
    framework_version: "2.4.1"
    model: claude-opus-4-7
    model_version: "20260101"
  tool: { name: github-mcp, version: "0.7.0", capability: github.merge }
  target:
    system: github.com/jamjet-labs/agentboundary
    environment: prod
    resource_id: pull/14
  arguments: { ref: refs/heads/main, sha: b1c2d3e4 }
expect:
  decision: allow
  conformance_level: 4
  receipt_must_validate: true
  failures_must_include: ["CHAIN_LINK_BROKEN"]
