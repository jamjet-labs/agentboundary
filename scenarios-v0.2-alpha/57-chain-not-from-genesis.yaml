name: 57-chain-not-from-genesis
description: |
  The genesis receipt is dropped and the chain is presented from its
  second receipt. Every remaining link is intact, but the first receipt
  presented points at a receipt that is not there, so the verifier cannot
  tell whether earlier receipts were removed: CHAIN_NOT_FROM_GENESIS.
setup:
  receipt_version: agentboundary/v0.2-alpha
  now: "2026-06-15T14:23:00Z"
  envelope:
    kid: scenario-test-key
    # TEST KEY ONLY: a fixed, public seed so the suite is deterministic.
    seed_hex: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
  policies:
    - name: agentboundary.repo.merges
      version: "2"
      rule: allow
      capabilities: [github.merge]
  chain:
    length: 3
    inject:
      - { op: drop, index: 0 }
action:
  actor: { type: agent, id: "agent:claude-code:session/demo" }
  agent:
    framework: claude-code
    framework_version: "2.4.1"
    model: claude-opus-4-7
    model_version: "20260101"
  tool: { name: github-mcp, version: "0.7.0", capability: github.merge }
  target:
    system: github.com/jamjet-labs/agentboundary
    environment: prod
    resource_id: pull/14
  arguments: { ref: refs/heads/main, sha: b1c2d3e4 }
expect:
  decision: allow
  conformance_level: 4
  receipt_must_validate: true
  failures_must_include: ["CHAIN_NOT_FROM_GENESIS"]
