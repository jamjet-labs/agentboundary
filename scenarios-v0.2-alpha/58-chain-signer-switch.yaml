name: 58-chain-signer-switch
description: |
  The last receipt of a signed chain is signed by a second key that the
  keyring also trusts. Each signature verifies on its own, but one actor's
  receipts are now signed by two keys: CHAIN_KEY_DISCONTINUITY. Without
  this check, a second key could take over an actor's history.
setup:
  receipt_version: agentboundary/v0.2-alpha
  now: "2026-06-15T14:23:00Z"
  envelope:
    kid: scenario-test-key
    # TEST KEY ONLY: a fixed, public seed so the suite is deterministic.
    seed_hex: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
  policies:
    - name: agentboundary.repo.merges
      version: "2"
      rule: allow
      capabilities: [github.merge]
  chain:
    length: 3
    inject:
      - { op: resign, index: 2, kid: scenario-second-key, seed_hex: "2021222324252627282930313233343536373839404142434445464748494a4b" }
action:
  actor: { type: agent, id: "agent:claude-code:session/demo" }
  agent:
    framework: claude-code
    framework_version: "2.4.1"
    model: claude-opus-4-7
    model_version: "20260101"
  tool: { name: github-mcp, version: "0.7.0", capability: github.merge }
  target:
    system: github.com/jamjet-labs/agentboundary
    environment: prod
    resource_id: pull/14
  arguments: { ref: refs/heads/main, sha: b1c2d3e4 }
expect:
  decision: allow
  conformance_level: 4
  receipt_must_validate: true
  failures_must_include: ["CHAIN_KEY_DISCONTINUITY"]
