name: 64-future-dated-approval
description: |
  A v0.1 runtime runs the action on an approval dated a day after the
  receipt was issued. Measured against issued_at, its age is negative, so
  a window check alone would call it fresh. It cannot have authorized an
  action that ran before it: LEVEL_4_FUTURE_DATED_APPROVAL. In v0.2-alpha
  mode the reference runtime refuses such an approval (scenario 75).
setup:
  now: "2026-06-15T14:23:00Z"
  policies:
    - name: acme.claims.mutation
      version: "5"
      rule: require-approval
      capabilities: [spring.service.mutation]
      approvers:
        - { id: "user:eng-lead@acme", type: human }
      approval_max_age_seconds: 600
  approvals:
    - capability: spring.service.mutation
      approver: { type: human, id: "user:eng-lead@acme" }
      approved_at: "2026-06-16T14:23:00Z"
action:
  actor: { type: agent, id: "agent:internal-copilot:session/demo" }
  agent:
    framework: spring-ai
    framework_version: "1.0"
    model: gpt-4o
    model_version: "2024-08-06"
  tool: { name: claims-service, version: "3.2.0", capability: spring.service.mutation }
  target:
    system: acme-claims.prod
    environment: prod
    resource_id: claim/789
  arguments: { claim_id: 789, status: APPROVED, payout_cents: 4200 }
expect:
  decision: allow
  conformance_level: 4
  receipt_must_validate: true
  failures_must_include: ["LEVEL_4_FUTURE_DATED_APPROVAL"]
