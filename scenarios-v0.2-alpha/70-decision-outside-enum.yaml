name: 70-decision-outside-enum
description: |
  policy.decision is rewritten to "approved", which is not one of allow,
  deny, escalate or require-approval, and the hash recomputed. The schema
  rejects the receipt, and Level 2 names the rule: LEVEL_2_DECISION_INVALID.
setup:
  policies:
    - name: agentboundary.repo.merges
      version: "2"
      rule: allow
      capabilities: [github.merge]
action:
  actor: { type: agent, id: "agent:claude-code:session/demo" }
  agent:
    framework: claude-code
    framework_version: "2.4.1"
    model: claude-opus-4-7
    model_version: "20260101"
  tool: { name: github-mcp, version: "0.7.0", capability: github.merge }
  target:
    system: github.com/jamjet-labs/agentboundary
    environment: prod
    resource_id: pull/14
  arguments: { ref: refs/heads/main, sha: b1c2d3e4 }
  inject:
    - { op: mutate_field, path: policy.decision, value: approved, recompute_hash: true }
expect:
  decision: allow
  conformance_level: 4
  receipt_must_validate: false
  failures_must_include: ["SCHEMA_INVALID", "LEVEL_2_DECISION_INVALID"]
