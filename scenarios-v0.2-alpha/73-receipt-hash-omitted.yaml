name: 73-receipt-hash-omitted
description: |
  The receipt_hash field is removed and the receipt is graded at Level 3.
  The schema requires the field, so the receipt fails the schema, and
  Level 3 names the rule: LEVEL_3_RECEIPT_HASH_REQUIRED. Scenario 10 is
  the same case for arguments_hash.
setup:
  policies:
    - name: agentboundary.repo.merges
      version: "2"
      rule: allow
      capabilities: [github.merge]
action:
  actor: { type: agent, id: "agent:claude-code:session/demo" }
  agent:
    framework: claude-code
    framework_version: "2.4.1"
    model: claude-opus-4-7
    model_version: "20260101"
  tool: { name: github-mcp, version: "0.7.0", capability: github.merge }
  target:
    system: github.com/jamjet-labs/agentboundary
    environment: prod
    resource_id: pull/14
  arguments: { ref: refs/heads/main, sha: b1c2d3e4 }
  inject:
    - { op: omit_field, path: receipt_hash }
expect:
  decision: allow
  conformance_level: 3
  receipt_must_validate: false
  failures_must_include: ["SCHEMA_INVALID", "LEVEL_3_RECEIPT_HASH_REQUIRED"]
