name: 74-chain-link-names-wrong-receipt
description: |
  The last receipt's prior_receipt keeps its predecessor's hash but names
  another receipt_id, and the receipt is rehashed. The hash comparison
  alone would pass this link; the verifier also checks that the link
  names the receipt before it: CHAIN_LINK_BROKEN.
setup:
  receipt_version: agentboundary/v0.2-alpha
  now: "2026-06-15T14:23:00Z"
  policies:
    - name: agentboundary.repo.merges
      version: "2"
      rule: allow
      capabilities: [github.merge]
  chain:
    length: 3
    inject:
      - op: edit_and_rehash
        index: 2
        path: prior_receipt.receipt_id
        value: "0192c8d0-1f2a-7c3e-bf2a-ffffffffffff"
action:
  actor: { type: agent, id: "agent:claude-code:session/demo" }
  agent:
    framework: claude-code
    framework_version: "2.4.1"
    model: claude-opus-4-7
    model_version: "20260101"
  tool: { name: github-mcp, version: "0.7.0", capability: github.merge }
  target:
    system: github.com/jamjet-labs/agentboundary
    environment: prod
    resource_id: pull/14
  arguments: { ref: refs/heads/main, sha: b1c2d3e4 }
expect:
  decision: allow
  conformance_level: 4
  receipt_must_validate: true
  failures_must_include: ["CHAIN_LINK_BROKEN"]
