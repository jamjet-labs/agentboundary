name: 32-fork-chain-shared-prior
description: |
  Spec v0.2-alpha section 2.0 permits forking: two receipts can name the
  same prior_receipt. The verifier has already recorded the shared
  ancestor (...5ec0eddedfa1) and a sibling (...5ec0eddedfa2) that also
  links to it, and the sibling is the newest receipt it holds. This
  receipt links to the ancestor, not to the newest receipt, and the chain
  check still passes: it looks the claimed predecessor up by receipt_id.
  A verifier that only accepts a link to its latest receipt, the usual
  "previous hash" log, rejects a fork and fails this scenario.
  Scenario 29 has one known receipt and no sibling, so it cannot tell the
  two apart. Fork-resolution policy is verifier-side, not spec-side.
setup:
  policies:
    - name: agentboundary.repo.merges
      version: "2"
      rule: allow
      capabilities: [github.merge]
  prior_receipt_hashes:
    "0192c8d0-1f2a-7c3e-bf2a-5ec0eddedfa1": "5555555555555555555555555555555555555555555555555555555555555555"
    "0192c8d0-1f2a-7c3e-bf2a-5ec0eddedfa2": "6666666666666666666666666666666666666666666666666666666666666666"
action:
  actor: { type: agent, id: "agent:claude-code:session/demo" }
  agent:
    framework: claude-code
    framework_version: "2.4.1"
    model: claude-opus-4-7
    model_version: "20260101"
  tool: { name: github-mcp, version: "0.7.0", capability: github.merge }
  target:
    system: github.com/jamjet-labs/agentboundary
    environment: prod
    resource_id: pull/15
  arguments: { ref: refs/heads/main, sha: f00bba12 }
  inject:
    - { op: mutate_field, path: version, value: "agentboundary/v0.2-alpha" }
    - op: mutate_field
      path: prior_receipt
      value:
        receipt_id: "0192c8d0-1f2a-7c3e-bf2a-5ec0eddedfa1"
        receipt_hash: "5555555555555555555555555555555555555555555555555555555555555555"
      recompute_hash: true
expect:
  decision: allow
  conformance_level: 4
  receipt_must_validate: true
